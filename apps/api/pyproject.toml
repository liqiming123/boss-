[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-collab-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]
