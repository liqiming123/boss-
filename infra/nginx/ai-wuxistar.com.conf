server {
    listen 80;
    listen [::]:80;
    server_name ai.wuxistar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.wuxistar.com;

    ssl_certificate /etc/letsencrypt/live/ai.wuxistar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.wuxistar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/recruitment-collab;
    index index.html;
    client_max_body_size 320m;
    access_log /www/wwwlogs/ai.wuxistar.com.log;
    error_log /www/wwwlogs/ai.wuxistar.com.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/api/v1/plugin/conversations/[^/]+/(snapshot|resume)$ {
        client_max_body_size 320m;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
