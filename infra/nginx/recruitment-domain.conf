# Standalone Nginx reverse-proxy plan for ai.wuxistar.com.
# Install only after the DNS record resolves and a TLS certificate exists.

server {
    listen 80;
    server_name ai.wuxistar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.wuxistar.com;

    ssl_certificate /etc/letsencrypt/live/ai.wuxistar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.wuxistar.com/privkey.pem;
    root /home/ubuntu/apps/recruitment-collab/current/apps/web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/api/v1/plugin/conversations/[^/]+/(snapshot|resume)$ {
        client_max_body_size 320m;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}
