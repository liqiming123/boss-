services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: recruitment, POSTGRES_USER: recruitment, POSTGRES_PASSWORD: recruitment}
    volumes: [recruitment_pg:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U recruitment"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"], interval: 10s, timeout: 3s, retries: 10}
  worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "recruitment_collab.workers.notification_worker"]
    env_file: [.env]
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    ports: ["5173:80"]
    depends_on: [api]
  mock-site:
    build: {context: ., dockerfile: infra/docker/mock-site.Dockerfile}
    ports: ["5174:80"]
volumes: {recruitment_pg: {}}

